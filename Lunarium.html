<div id="cf" style="display:none"><p>Volume <input type="range" min="0" max="1" step=".05" value="${set.vol}" oninput="set.vol=+this.value;save()"><br>Sensibilidade da câmera <input type="range" min=".3" max="2" step=".1" value="${set.sens}" oninput="set.sens=+this.value;save()"></p></div>
<div id="ct" style="display:none"><p>WASD/setas: mover · Mouse: mirar · Clique: gelo · Q: Nova (10s) · E: Esquiva · F: Espada · C/R/V: poderes de cristal (desbloqueados ao ingerir Cristal) · Shift: furtivo · Tab: inventário (o combate continua) · 1-8: equipar/usar · Esc: pausa</p></div>`)}
function sub(id){$(id).style.display=$(id).style.display=='none'?'block':'none'}
function resume(){if(state!='paused')return;hide();state='play';last=performance.now()}
function restartC(){if(!confirm('Reiniciar a campanha do início? O progresso salvo será apagado.'))return;try{localStorage.removeItem('lunarium_v1')}catch(e){}hide();begin(false)}
function screenDead(){state='dead';scr(`<h1 style="color:#c44">DERROTA</h1><p>O gelo se parte, mas não esquece.</p><button onclick="retry()">Tentar a arena novamente</button><button onclick="restartC()">Reiniciar campanha</button>`)}
function retry(){hide();P.hp=CFG.hp;startArena(ai,false)}
function screenWin(){state='win';try{localStorage.removeItem('lunarium_v1')}catch(e){}scr(`<h1>VITÓRIA</h1><p>${STORY.end}</p><p><i>Fim da campanha.</i></p><button onclick="begin(false)">Jogar novamente</button>`)}
// ===== INPUT (registrado uma única vez) =====
addEventListener('keydown',e=>{if(e.code=='Tab'){e.preventDefault();if(state=='play'||state=='paused'){const v=$('inv');v.style.display=v.style.display=='grid'?'none':'grid';rInv()}return}
if(e.code=='Escape'){state=='play'?pause():resume();return}if(e.repeat&&e.code!='KeyW')K[e.code]=true;K[e.code]=true;if(state!='play')return;
if(/^Digit[1-8]$/.test(e.code))useSlot(+e.code[5]-1);else if(e.code=='KeyQ')nova();else if(e.code=='KeyE')dash();else if(e.code=='KeyF')sword();else if(e.code=='KeyC')shards();else if(e.code=='KeyR')lance();else if(e.code=='KeyV')storm();else if(e.code=='Enter'&&cleared)goNext()});
addEventListener('keyup',e=>K[e.code]=false);addEventListener('blur',()=>{for(const k in K)K[k]=false;held=false;pause()});
addEventListener('mousemove',e=>mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1));
R.domElement.addEventListener('mousedown',e=>{if(e.button==0){held=true;if(state=='play')bolt()}});addEventListener('mouseup',()=>held=false);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(state=='play')upd(dt);R.render(S,C)}
build(0);C.position.set(0,15,26);C.lookAt(0,0,10);menu();requestAnimationFrame(t=>{last=t;loop(t)});
